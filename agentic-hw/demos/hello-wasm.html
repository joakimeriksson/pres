<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hello-wasm</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#222;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:18px}
  #log{padding:22px 26px;white-space:pre-wrap;line-height:1.45}
  .ok{color:#009BA5}.dim{color:#888}.warn{color:#D9534F}
  #cur::after{content:"█";animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<div id="log"></div>
<script>
// A complete WebAssembly module, hand-assembled, so this page needs no build step and no server:
//   (module (func (export "add") (param i32 i32) (result i32) local.get 0 local.get 1 i32.add))
const bytes = new Uint8Array([
  0x00,0x61,0x73,0x6d, 0x01,0x00,0x00,0x00,             // magic, version
  0x01,0x07,0x01,0x60,0x02,0x7f,0x7f,0x01,0x7f,          // type: (i32,i32)->i32
  0x03,0x02,0x01,0x00,                                   // func 0 : type 0
  0x07,0x07,0x01,0x03,0x61,0x64,0x64,0x00,0x00,          // export "add"
  0x0a,0x09,0x01,0x07,0x00,0x20,0x00,0x20,0x01,0x6a,0x0b // code
]);
const log = document.getElementById('log');
const line = (t, cls) => { const s = document.createElement('span'); s.className = cls || ''; s.textContent = t + '\n'; log.appendChild(s); };
(async () => {
  line('demo slot — replace demos/hello-wasm.html with your WASM build', 'dim');
  line('');
  line('> WebAssembly.instantiate(' + bytes.length + ' bytes)');
  try {
    const { instance } = await WebAssembly.instantiate(bytes);
    line('  ok — exports: ' + Object.keys(instance.exports).join(', '), 'ok');
    line('> add(21, 21) = ' + instance.exports.add(21, 21));
    // keep something moving so the audience can see it is live
    let n = 0, t0 = performance.now();
    const cur = document.createElement('span'); cur.id = 'cur'; log.appendChild(cur);
    (function tick(){
      for (let i = 0; i < 100000; i++) n = instance.exports.add(n, 1);
      const s = (performance.now() - t0) / 1000;
      cur.textContent = '> ' + n.toLocaleString() + ' calls · ' + (n / s / 1e6).toFixed(1) + ' M calls/s ';
      requestAnimationFrame(tick);
    })();
  } catch (e) {
    line('  failed: ' + e.message, 'warn');
  }
})();
</script>
</body>
</html>
