<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Viewer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c1e21; --muted: #6b7280; --line: #d1d5db;
    --belt: #cbd2dc; --belt-edge: #8b95a5; --log: #b8864b; --log-edge: #6e4c22; --plank: #e3c48f; --block: #d4a766; --side: #c9b48a;
    --off: #9ca3af; --starting: #f59e0b; --running: #16a34a; --stopping: #f97316;
    --beam: #2563eb; --beam-blocked: #dc2626; --accent: #2563eb;
    --fieldbus: #16a34a; --supervisory: #2563eb; --uns-link: #8b5cf6; --it-link: #0f766e; --band: #f8f9fb; --band-alt: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --panel: #1a1f26; --ink: #e5e7eb; --muted: #9ca3af; --line: #2d3540;
      --band: #161b21; --band-alt: #1d232b; --uns-link: #a78bfa; --it-link: #2dd4bf;
      --belt: #3b4552; --belt-edge: #6b7686; --log: #c08a4c; --log-edge: #3f2a12; --plank: #d9b77a; --block: #c9974f; --side: #a8946a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  main.wide { max-width: 1680px; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  main.wide .workspace { grid-template-columns: minmax(0, 1fr) 400px; }
  @media (max-width: 1100px) { main.wide .workspace { grid-template-columns: minmax(0, 1fr); } }
  #uns { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
         display: flex; flex-direction: column; max-height: calc(100vh - 110px); position: sticky; top: 12px; }
  #uns h2 { font-size: 14px; margin: 0 0 6px; }
  #uns .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  #uns .bar button.on { border-color: var(--accent); color: var(--accent); }
  #uns input[type=search] { flex: 1 1 140px; font: inherit; padding: 4px 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--bg); color: var(--ink); }
  #uns .prefix { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-bottom: 4px; word-break: break-all; }
  #uns-tree { overflow-y: auto; flex: 1 1 auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #uns-tree details { margin-left: 10px; }
  #uns-tree summary { cursor: pointer; color: var(--ink); }
  #uns-tree summary.eq-selected { color: var(--accent); font-weight: 600; }
  #uns-tree .sig { display: flex; gap: 8px; margin-left: 22px; cursor: pointer; border-radius: 4px; padding: 0 4px; }
  #uns-tree .sig:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #uns-tree .sig.selected { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  #uns-tree .sig .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #uns-tree .sig .v { color: var(--running); white-space: nowrap; }
  #uns-tree .sig .r { color: var(--muted); font-size: 10px; width: 28px; text-align: right; }
  #uns-card { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font-size: 12px; }
  #uns-card code { font-size: 11px; word-break: break-all; }
  #uns-card .k { color: var(--muted); width: 88px; display: inline-block; vertical-align: top; }
  #uns-card .row { margin: 2px 0; }
  #uns-card .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #uns-card .chip { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; background: var(--bg); }
  #uns-card .chip.zone-cell, #uns-card .chip.zone-control { border-color: var(--running); }
  #uns-card .chip.zone-supervisory, #uns-card .chip.zone-operations { border-color: var(--accent); }
  #uns-card .chip.zone-dmz { border-color: var(--starting); }
  #uns-card .chip.zone-enterprise, #uns-card .chip.zone-external { border-color: var(--stopping); }
  #live { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  #live .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
  #live .dot { color: var(--beam-blocked); font-weight: 700; }
  #live .dot.paused { color: var(--muted); }
  #live select, #live button { font-size: 13px; }
  #live button.danger { border-color: var(--beam-blocked); color: var(--beam-blocked); }
  #live-msg { font-size: 12px; }
  #live-trip { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--beam-blocked);
               color: var(--beam-blocked); display: block; }
  #live-faults { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  #live-faults span { border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; }
  #live-faults span.active { border-color: var(--beam-blocked); color: var(--beam-blocked); }
  #live-faults span.repairing { border-color: var(--starting); color: var(--starting); }
  #security { margin-top: 8px; font-size: 12px; }
  #security .sechead { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 4px; }
  #security .sechead b { font-size: 14px; }
  #sec-events { max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  #sec-events .netev { display: grid; grid-template-columns: 64px 76px 1fr; gap: 8px; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  #sec-events .netev:last-child { border-bottom: 0; }
  #sec-events .netev .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  #sec-events .netev.sev-alarm .k { color: var(--beam-blocked); font-weight: 600; }
  #sec-events .netev.sev-warning .k { color: var(--starting); font-weight: 600; }
  #sec-events .netev.future { opacity: .35; }
  #flow { height: 330px; margin-top: 10px; cursor: pointer; }
  .flowhead { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 12px; align-items: baseline; }
  .flowhead b { font-size: 14px; margin-right: 4px; }
  .flowhead .cls { display: inline-flex; gap: 6px; align-items: center; }
  .flowhead .sw { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  #uns-card canvas { width: 100%; height: 48px; border: none; margin-top: 4px; }
  canvas { width: 100%; display: block; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { flex: 1 1 240px; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line);
                   border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-variant-numeric: tabular-nums; font-size: 18px; }
  .stat.alarms { grid-column: 1 / -1; }
  .alarm { border-left: 3px solid var(--beam-blocked); padding: 4px 8px; margin: 6px 0; }
  .hint { color: var(--muted); }
  #timeline { width: 100%; height: 44px; display: block; cursor: pointer; margin-top: 4px;
              background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #agent { margin-top: 10px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 10px; max-height: 220px; overflow-y: auto;
           font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #agent .ev { color: var(--muted); }
  #agent .ev.done { color: var(--ink); }
  #agent .ev.now { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  #agent .marker { color: var(--beam-blocked); }
  #agent .marker.open { color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 32px; text-align: center;
          color: var(--muted); }
  #drop.over { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Line Viewer</h1>
  <input id="file" type="file" accept=".jsonl,.json">
  <span id="meta" class="hint"></span>
  <a id="toDash" href="#" hidden>dashboard →</a>
</header>
<main>
  <div id="drop">Drop a recording here or choose a file above.<br>
    <code>uv run industrial-testbed run --scenario cv102_jam_v1 --record runs/jam.jsonl</code></div>
  <div id="app" hidden><div class="workspace"><div class="left">
    <canvas id="c" height="400"></canvas>
    <div id="flowhead" class="flowhead" hidden></div>
    <canvas id="flow" hidden></canvas>
    <div id="security" hidden>
      <div class="sechead" id="sec-head"></div>
      <div id="sec-events"></div>
    </div>
    <div class="controls">
      <button id="play">Play</button>
      <button id="stepb">−1</button>
      <button id="stepf">+1</button>
      <select id="speed">
        <option value="0.25">0.25×</option><option value="1" selected>1×</option>
        <option value="4">4×</option><option value="16">16×</option><option value="64">64×</option>
      </select>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <span id="time" class="hint" style="min-width: 150px"></span>
    </div>
    <div id="live" hidden>
      <div class="row">
        <span class="dot" id="live-dot">● LIVE</span>
        <span class="hint" id="live-status"></span>
        <label class="hint">speed <select id="live-speed"></select></label>
        <button id="live-pause">Pause</button>
        <button id="live-follow">Follow live</button>
        <button id="live-reset">Reset line</button>
      </div>
      <div class="row">
        <b style="font-size:13px">Break something:</b>
        <select id="live-device" title="device (click a machine on the line to pick it)"></select>
        <select id="live-fault"></select>
        <select id="live-duration">
          <option value="">until repaired</option><option value="30">for 30 s</option>
          <option value="60">for 60 s</option><option value="120">for 2 min</option>
        </select>
        <button id="live-inject" class="danger">Inject fault</button>
        <button id="live-repair">Send maintenance</button>
      </div>
      <div class="row">
        <b style="font-size:13px">Break the network:</b>
        <select id="comm-type">
          <option value="link_down">link down</option><option value="degraded">link degraded</option>
          <option value="system_down">system down</option><option value="host_down">host down</option><option value="zone_isolated">zone isolated</option>
        </select>
        <select id="comm-target"></select>
        <select id="comm-degrade" title="loss and latency">
          <option value="40,0">40 % lost</option><option value="0,2000">2 s late</option>
          <option value="40,2000" selected>40 % lost, 2 s late</option><option value="90,0">90 % lost</option>
        </select>
        <button id="comm-inject" class="danger">Inject</button>
      </div>
      <div class="row" id="live-trip" hidden></div>
      <div class="row">
        <b style="font-size:13px">Security:</b>
        <button id="sec-fw">Enforce firewall</button>
        <button id="sec-vendor">Open supplier session</button>
        <span id="sec-sessions" class="hint"></span>
      </div>
      <div class="row"><div id="live-faults"></div></div>
      <div class="row"><span id="live-msg" class="hint"></span></div>
    </div>
    <canvas id="timeline" hidden></canvas>
    <div id="agent" hidden></div>
    <div id="stats" class="stats"></div>
  </div>
  <aside id="uns" hidden>
    <h2>Unified namespace</h2>
    <div class="bar">
      <span class="hint">names:</span>
      <button data-mode="uns" class="on">UNS topic</button><button data-mode="opcua">OPC UA</button><button data-mode="plc">PLC tag</button>
    </div>
    <div class="bar"><input id="uns-search" type="search" placeholder="filter: CV201, current, _cmd …"></div>
    <div id="uns-prefix" class="prefix"></div>
    <div id="uns-tree"></div>
    <div id="uns-card" class="hint">Click a machine on the line or a signal in the tree.</div>
  </aside>
  </div></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let layout = null, frames = [], index = 0, playing = false, lastTime = 0, carry = 0;
let agentEvents = [], markers = [], netEvents = [];
let ns = null, selectedSignal = null, selectedEquipment = null, selectedSystem = null, nameMode = 'uns', hits = [];

// what each system saw, where it differs from a perfect UNS (comm faults); null = caught up
function mergeSeen(prev, delta) {
  if (!delta || !Object.keys(delta).length) return prev;
  const out = Object.assign({}, prev);
  for (const [sys, d] of Object.entries(delta)) {
    const m = Object.assign({}, out[sys] || {});
    for (const [k, v] of Object.entries(d)) { if (v === null) delete m[k]; else m[k] = v; }
    if (Object.keys(m).length) out[sys] = m; else delete out[sys];
  }
  return out;
}
function parse(text) {
  setup(text.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)));
}
function setup(records) {
  layout = records.find(r => r.type === 'layout');
  if (!layout) throw new Error('recording has no layout record');
  frames = records.filter(r => r.type === 'frame');
  // episode replays (industrial-testbed replay --view) also carry the agent's tool calls and
  // markers, some of them verifier truth the agent never saw
  agentEvents = records.filter(r => r.type === 'agent');
  netEvents = records.filter(r => r.type === 'net');
  markers = records.filter(r => r.type === 'marker');
  $('timeline').hidden = $('agent').hidden = !(agentEvents.length || markers.length);
  // frames carry only the values that changed; rebuild the full set per frame
  // and only the link counts that changed (0 = link went idle)
  let carried = {}, carriedFlow = {}, carriedSeen = {};
  for (const fr of records.filter(r => r.type === 'frame')) {
    carried = Object.assign({}, carried, fr.values || {});
    fr.values = carried;
    carriedFlow = Object.assign({}, carriedFlow, fr.flow || {});
    fr.flow = carriedFlow;
    carriedSeen = mergeSeen(carriedSeen, fr.seen);
    fr.seen = carriedSeen;
    fr.comm = fr.comm || {};
  }
  ns = records.find(r => r.type === 'namespace') || null;
  if (!frames.length) throw new Error('recording has no frames');
  index = 0;
  $('scrub').max = frames.length - 1;
  $('meta').textContent = `${layout.plant} · seed ${layout.seed} · ${frames.length} frames · ${layout.tick_ms} ms/tick`;
  $('drop').hidden = true; $('app').hidden = false;
  $('meta').textContent = live ? `${layout.plant} · live · ${layout.tick_ms} ms/tick` : $('meta').textContent;
  buildUns();
  $('flow').hidden = $('flowhead').hidden = !(ns && ns.links && ns.links.length);
  $('security').hidden = !(ns && ns.security && ns.security.conduits);
  const hasKpis = !!(ns && ns.signals.some(s => s.role === 'kpi'));
  $('toDash').hidden = !(hasKpis && (src || live));
  setPlaying(false);
  // ?t=SECONDS jumps to a moment; ?play=SPEED starts playback at that speed
  const params = new URLSearchParams(location.search);
  const t = parseFloat(params.get('t'));
  if (!isNaN(t)) index = Math.max(0, frames.findIndex(fr => fr.sim_time_ms >= t * 1000));
  const pick = params.get('select');
  if (pick && ns) { const sig = ns.signals.find(x => x.plc_tag === pick.toUpperCase()); if (sig) { selectedSignal = sig; selectedEquipment = sig.equipment; buildUns(); } }
  const speed = params.get('play');
  if (speed && [...$('speed').options].some(o => o.value === speed)) { $('speed').value = speed; setPlaying(true); }
  render();
  // ?focus=flow scrolls a section into view (e.g. the information flow, for a slide)
  const focus = params.get('focus');
  if (focus === 'flow') requestAnimationFrame(() => $('flowhead').scrollIntoView({ block: 'start' }));
}

function load(file) {
  file.text().then(parse).catch(e => { alert(e.message); });
}
$('file').addEventListener('change', e => e.target.files[0] && load(e.target.files[0]));
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over');
  e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });

// Serve the repo root (python -m http.server) and open viewer/?src=runs/line-1234.jsonl
const src = new URLSearchParams(location.search).get('src');
const live = new URLSearchParams(location.search).has('live');
if (live) startLive();
else if (src) {
  fetch(src.startsWith('/') || src.includes('://') ? src : '../' + src)
    .then(r => { if (!r.ok) throw new Error(`${r.status} loading ${src}`); return r.text(); })
    .then(parse).catch(e => { $('meta').textContent = e.message; });
}

// ---- live mode (industrial-testbed live) ------------------------------------
// The server streams the same records as a recording; commands go back as JSON. Faults shown here
// were injected by the operator in this browser (or another), so listing them is no leak.
const MAX_FRAMES = 6000;  // 10 min of history at 10 frames/s
let following = true, liveInfo = null, liveStatus = null, renderQueued = false;
function startLive() {
  $('drop').textContent = 'Connecting to the live simulation…';
  let header = [];
  const es = new EventSource('/live/stream');
  es.onmessage = ev => {
    const r = JSON.parse(ev.data);
    if (r.type === 'live') { liveStatus = r; updateLivePanel(); return; }
    if (!layout || header.length) {
      header.push(r);
      if (r.type !== 'frame') return;
      setup(header); header = [];
      $('live').hidden = false;
      ['play', 'stepb', 'stepf', 'speed'].forEach(id => $(id).hidden = true);
      index = frames.length - 1;
      fetch('/live/info').then(x => x.json()).then(info => { liveInfo = info; buildLivePanel(); });
      render();
      return;
    }
    if (r.type === 'marker') { markers.push(r); $('timeline').hidden = false; queueRender(); return; }
    if (r.type === 'net') { netEvents.push(r); queueRender(); return; }
    if (r.type !== 'frame') return;
    const prev = frames[frames.length - 1];
    r.values = Object.assign({}, prev.values, r.values || {});
    r.flow = Object.assign({}, prev.flow, r.flow || {});
    r.seen = mergeSeen(prev.seen || {}, r.seen);
    r.comm = r.comm || {};
    frames.push(r);
    if (frames.length > MAX_FRAMES) { const n = frames.length - MAX_FRAMES; frames.splice(0, n); index = Math.max(0, index - n); }
    $('scrub').max = frames.length - 1;
    if (following) index = frames.length - 1;
    queueRender();
  };
  es.onerror = () => { $('live-dot').textContent = '○ disconnected'; $('live-dot').classList.add('paused'); };
  es.onopen = () => { $('live-dot').textContent = '● LIVE'; $('live-dot').classList.remove('paused'); };
}
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function sendLive(cmd) {
  return fetch('/live/command', { method: 'POST', body: JSON.stringify(cmd) })
    .then(r => r.json()).then(res => { $('live-msg').textContent = res.message; $('live-msg').style.color = res.ok ? '' : css('--beam-blocked'); return res; })
    .catch(e => { $('live-msg').textContent = e.message; });
}
function buildLivePanel() {
  $('live-speed').innerHTML = liveInfo.speeds.map(v => `<option value="${v}">${v}×</option>`).join('');
  $('live-speed').value = String(liveInfo.status.speed);
  $('live-device').innerHTML = Object.keys(liveInfo.catalog).map(d => `<option>${d}</option>`).join('');
  fillFaultTypes();
  fillCommTargets();
  updateLivePanel();
}
function fillFaultTypes() {
  const types = liveInfo.catalog[$('live-device').value] || [];
  $('live-fault').innerHTML = types.map(t => `<option value="${t}">${t.replaceAll('_', ' ')}</option>`).join('');
}
function pickLiveDevice(equipment) {
  // clicking a machine offers its first breakable device (the belt, then its motor, ...)
  if (!liveInfo || !equipment) return;
  const device = Object.keys(liveInfo.catalog).find(d => d === equipment || d.startsWith(equipment + '.'));
  if (device) { $('live-device').value = device; fillFaultTypes(); }
}
function updateLivePanel() {
  if (liveStatus?.defenses) {
    const on = liveStatus.defenses.enforce_conduits;
    $('sec-fw').textContent = on ? 'Firewall enforced: switch off' : 'Enforce firewall';
    $('sec-fw').classList.toggle('danger', !on);
    const open = (liveStatus.sessions || []).find(x => x.principal === supplier());
    $('sec-vendor').hidden = !supplier();
    $('sec-vendor').textContent = open ? `Close supplier session ${open.id}` : `Open supplier session to ${sysName(systemOfKind('scada'))}`;
    $('sec-sessions').textContent = (liveStatus.sessions || []).map(x => `${x.id}: ${x.principal} → ${x.target}`).join(' · ');
  }
  if (!liveStatus) return;
  const f = frames[frames.length - 1];
  const clock = f ? new Date(f.sim_time_ms).toISOString().slice(11, 19) : '';
  $('live-status').textContent = `${liveStatus.scenario} · seed ${liveStatus.seed} · sim time ${clock}`;
  // a trip is latched: the PLC does not restart the line by itself once the cause is gone
  const tripped = liveStatus.alarms.length > 0;
  const causes = liveStatus.faults.filter(x => x.active);
  const repairing = causes.some(x => x.repairing);
  $('live-trip').hidden = !tripped;
  $('live-trip').innerHTML = !tripped ? '' : `<b>Line tripped</b> (${liveStatus.alarms.join(', ')}). ` + (
    causes.length === 0 ? 'The cause is gone, but the trip is latched: press <b>Reset line</b> to restart.'
    : repairing ? 'Maintenance is under way; press <b>Reset line</b> once it is done.'
    : 'Fix the cause first (<b>Send maintenance</b> to the faulty device), then press <b>Reset line</b>.');
  $('live-reset').classList.toggle('danger', tripped && causes.length === 0);

        ctx.fillStyle = css('--muted');
        const full = `${m.speed_mm_s} mm/s · ${(m.current_mA / 1000).toFixed(1)} A · ${(m.temperature_mC / 1000).toFixed(0)} °C`;
        ctx.fillText(w > 200 ? full : `${(m.current_mA / 1000).toFixed(1)} A`, x + 20, y0 + 14);
      }
      ctx.restore();
    } else if (seg.kind === 'station') {
      const st = f.stations?.[seg.id] || {};
      const active = ['CUTTING'].includes(st.state);
      ctx.fillStyle = css('--panel'); ctx.strokeStyle = active ? css('--beam-blocked') : css('--belt-edge');
      ctx.lineWidth = active ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(x, beltY - 10, w, beltH + 20, 6); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.save(); ctx.beginPath(); ctx.rect(x, beltY + beltH + 4, w, 70); ctx.clip();
      ctx.fillStyle = css('--ink'); ctx.textAlign = 'left';
      ctx.fillText(seg.id, x + 4, beltY + beltH + 22);
      ctx.fillStyle = css('--muted');
      ctx.fillText(seg.label || '', x + 4, beltY + beltH + 36);
      ctx.fillStyle = st.enable === false ? css('--off') : css('--muted');
      ctx.fillText(`${(st.state ?? '').replace('WAITING_FOR_LOG', 'WAITING')}${st.clamp_closed ? ' · clamp' : ''}`, x + 4, beltY + beltH + 50);
      ctx.fillText(`cuts ${st.cuts ?? 0}`, x + 4, beltY + beltH + 64);
      ctx.restore();
    } else if (seg.kind === 'diverter') {
      const dv = f.diverters?.[seg.id] || {};
      const moving = (dv.state || '').startsWith('MOVING');
      ctx.fillStyle = css('--panel'); ctx.strokeStyle = moving ? css('--starting') : css('--belt-edge');
      const dw = 28;
      ctx.beginPath(); ctx.moveTo(x, beltY); ctx.lineTo(x + dw, beltY - 14); ctx.lineTo(x + dw, beltY + beltH + 14);
      ctx.lineTo(x, beltY + beltH); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = css('--ink'); ctx.textAlign = 'center';
      ctx.fillText(moving ? '…' : (dv.state || '').replace('POSITION_', ''), x + dw / 2, beltY - 22);
      ctx.fillStyle = css('--ink'); ctx.textAlign = 'left';
      ctx.fillText(seg.id, x - 2, beltY + beltH + 32);  // per-route counts are on the bins
      x += dw;
    }
    x += w;
  }
  const beltsEnd = x;

  // logs (position_mm is the leading edge measured from the segment inlet); a log entering from
  // the source has a negative tail, so clip drawing to the belts
  ctx.save();
  ctx.beginPath(); ctx.rect(margin + endcap, beltY - 12, beltsEnd - margin - endcap, beltH + 24); ctx.clip();
  const transverseSeg = Object.fromEntries(segments.map(s => [s.id, !!s.transverse]));
  for (const log of f.materials) {
    const sx = segX[log.segment]; if (sx === undefined) continue;
    if (transverseSeg[log.segment]) {
      // crosswise: along the flow a piece occupies its width; drawn as a tall bar
      const extent = log.width_mm ?? log.diameter_mm;
      const lead = sx + log.position_mm * scale, wpx = Math.max(3, extent * scale);
      ctx.fillStyle = css({ block: '--block', plank: '--plank', side_board: '--side' }[log.kind] || '--log');
      ctx.strokeStyle = css('--log-edge');
      ctx.beginPath(); ctx.rect(lead - wpx, beltY - 12, wpx, beltH + 24); ctx.fill(); ctx.stroke();
      continue;
    }
    const lead = sx + log.position_mm * scale, len = log.length_mm * scale;
    const kind = log.kind || 'log';
    const h = { block: 14, plank: 7, side_board: 4 }[kind]
      ?? Math.max(6, Math.min(beltH - 8, log.diameter_mm * scale * 1.5));
    ctx.fillStyle = css({ block: '--block', plank: '--plank', side_board: '--side' }[kind] || '--log');
    ctx.strokeStyle = css('--log-edge');
    ctx.beginPath(); ctx.roundRect(lead - len, beltY + (beltH - h) / 2, len, h, 3); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // scanners
  for (const seg of conveyors) for (const s of (seg.scanners || [])) {
    const sv = f.scanners?.[s.id] || {}; const px = segX[seg.id] + s.position_mm * scale;
    hits.unshift({ id: s.id, x: px - 7, y: beltY - 48, w: 14, h: beltH + 56 });
    ctx.strokeStyle = css('--running'); ctx.lineWidth = 2; ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(px, beltY - 14); ctx.lineTo(px, beltY + beltH + 6); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = css('--running'); ctx.textAlign = 'center';
    ctx.fillText(s.id, px, beltY - 24);
    ctx.fillStyle = css('--muted');
    ctx.fillText(sv.last_diameter_mm ? `⌀${sv.last_diameter_mm} · ${sv.last_length_mm} mm` : `n=${sv.measurements ?? 0}`, px, beltY - 40);
  }

  // photo-eyes drawn on top of logs
  for (const seg of conveyors) for (const s of seg.sensors) {
    const sv = f.sensors[s.id] || {}; const px = segX[seg.id] + s.position_mm * scale;
    hits.unshift({ id: s.id, x: px - 7, y: beltY - 48, w: 14, h: beltH + 56 });
    ctx.strokeStyle = sv.blocked ? css('--beam-blocked') : css('--beam'); ctx.lineWidth = 2;
    ctx.setLineDash(sv.blocked ? [] : [4, 3]);
    ctx.beginPath(); ctx.moveTo(px, beltY - 14); ctx.lineTo(px, beltY + beltH + 6); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = ctx.strokeStyle; ctx.textAlign = 'center';
    ctx.fillText(`${s.id}${sv.blocked ? ' ●' : ''}`, px, beltY - 24);
    ctx.fillStyle = css('--muted'); ctx.fillText(`n=${sv.count ?? 0}`, px, beltY - 40);
  }

  // namespace selection: outline the equipment the selected signal (or click) belongs to
  const sel = selectedEquipment && hits.find(h => h.id === selectedEquipment);
  if (sel) {
    ctx.strokeStyle = css('--accent'); ctx.lineWidth = 2.5; ctx.setLineDash([]);
    ctx.beginPath(); ctx.roundRect(sel.x - 3, sel.y - 3, sel.w + 6, sel.h + 6, 6); ctx.stroke();
    ctx.lineWidth = 1;
  }

  drawTrend(ctx, W, H, margin, endcap);

  // legend
  ctx.textAlign = 'left'; let lx = margin;
  for (const [k, v] of Object.entries({ OFF: '--off', STARTING: '--starting', RUNNING: '--running', STOPPING: '--stopping' })) {
    ctx.fillStyle = css(v); ctx.beginPath(); ctx.arc(lx + 6, H - 16, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = css('--muted'); ctx.fillText(k, lx + 16, H - 16); lx += 90;
  }
}

// Motor current over the last TREND_FRAMES frames, one line per motor, rated = 8 A.
const TREND_FRAMES = 300, MOTOR_COLORS = ['--accent', '--stopping', '--running', '--starting', '--beam-blocked'];
function drawTrend(ctx, W, H, margin, endcap) {
  const top = 215, height = 120, left = margin + endcap, width = W - 2 * margin - 2 * endcap;
  const start = Math.max(0, index - TREND_FRAMES + 1), slice = frames.slice(start, index + 1);
  const motorIds = Object.keys(frames[index].motors);
  const maxA = 24;
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
  ctx.strokeRect(left + 0.5, top + 0.5, width, height);
  ctx.fillStyle = css('--muted'); ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'right';
  for (const a of [0, 8, 16, 24]) {
    const y = top + height - (a / maxA) * height;
    ctx.fillText(`${a} A`, left - 6, y);
    if (a === 8) { ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + width, y); ctx.stroke(); ctx.setLineDash([]); }
  }
  ctx.textAlign = 'left';
  ctx.fillText('motor current, last ' + Math.round(TREND_FRAMES * (frames[1] ? (frames[1].sim_time_ms - frames[0].sim_time_ms) : layout.tick_ms) / 1000) + ' s', left + 6, top + 12);
  motorIds.forEach((id, i) => {
    ctx.strokeStyle = css(MOTOR_COLORS[i % MOTOR_COLORS.length]); ctx.lineWidth = 1.5;
    ctx.beginPath();
    slice.forEach((fr, j) => {
      const xx = left + (j / (TREND_FRAMES - 1)) * width;
      const yy = top + height - Math.min(1, fr.motors[id].current_mA / 1000 / maxA) * height;
      j === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
    });
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle; ctx.fillText(id, left + 6 + i * 80, top + height - 6);
  });
  // alarms raised inside the window
  const f = frames[index];
  for (const a of f.alarms || []) {
    const j = slice.findIndex(fr => fr.tick >= a.tick);
    if (j < 0) continue;
    const xx = left + (j / (TREND_FRAMES - 1)) * width;
    ctx.strokeStyle = css('--beam-blocked'); ctx.setLineDash([2, 2]);
    ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, top + height); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.font = '12px system-ui, sans-serif';
}

// ---- process plants (the kiln) --------------------------------------------------------------
// A mimic in the style of a kiln HMI: what the instruments report, beside the true state that no
// instrument shows (drying gradient, crack index) - the gap between the two is the lesson.
const PROC_UNIT = { temperature: ['m°C', 1000, '°C', 1], humidity: ['‰', 10, '%', 1], moisture: ['bp', 100, '%', 2], heat_power: ['W', 1000, 'kW', 0] };
function procVal(measures, raw) {
  const [, div, unit, dec] = PROC_UNIT[measures] || ['', 1, '', 0];
  return raw == null ? '–' : `${(raw / div).toFixed(dec)} ${unit}`;
}
function drawProcess(f) {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = 400;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
  hits = [];
  const unit = layout.units[0], truth = (f.process || {})[unit.id] || {}, v = f.values || {};
  const devs = unit.devices, byRole = r => devs.find(d => d.kind === 'valve' && d.role === r);
  const x0 = 150, y0 = 40, cw = Math.min(460, W - 520), ch = 190;
  // chamber and timber stacks
  ctx.fillStyle = css('--belt'); ctx.strokeStyle = css('--belt-edge'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x0, y0, cw, ch, 8); ctx.fill(); ctx.stroke();
  hits.push({ id: unit.id, x: x0, y: y0, w: cw, h: ch });
  for (let i = 0; i < 3; i++) for (let row = 0; row < 7; row++) {
    ctx.fillStyle = css(row % 2 ? '--plank' : '--block');
    ctx.fillRect(x0 + 40 + i * (cw - 80) / 3, y0 + 60 + row * 16, (cw - 80) / 3 - 18, 11);
  }
  ctx.fillStyle = css('--ink'); ctx.font = '600 13px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`${unit.id} · drying kiln · step ${v[`${unit.id}/program_step`] ?? '–'}`, x0 + 10, y0 + 8);
  ctx.font = '12px system-ui'; ctx.fillStyle = css('--muted');
  ctx.fillText(`setpoint ${procVal('temperature', v[`${unit.id}/temp_sp`])} · ${procVal('humidity', v[`${unit.id}/rh_sp`])} RH`, x0 + 10, y0 + 26);
  // valves: heating (district heating, left), vent (roof), spray (roof)
  const valve = (d, x, y, label) => {
    if (!d) return;
    const pos = v[`${d.id}/position`] ?? 0, cmd = v[`${d.id}/command`] ?? 0;
    ctx.fillStyle = css('--panel'); ctx.strokeStyle = css('--belt-edge'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, 108, 34, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = css('--running'); ctx.fillRect(x + 4, y + 24, 100 * pos / 1000, 6);
    ctx.fillStyle = css('--ink'); ctx.font = '11px system-ui'; ctx.textBaseline = 'top';
    ctx.fillText(`${label} ${d.id}`, x + 5, y + 4);
    ctx.fillStyle = css('--muted');
    ctx.fillText(`${(pos / 10).toFixed(0)} % ${Math.abs(pos - cmd) > 20 ? `(cmd ${(cmd / 10).toFixed(0)} %)` : ''}`, x + 5, y + 14);
    hits.push({ id: d.id, x, y, w: 108, h: 34 });
  };
  valve(byRole('heating'), 20, y0 + ch / 2 - 17, 'heat');
  valve(byRole('vent'), x0 + cw - 118, 2, 'vent');
  valve(byRole('spray'), x0 + 10, 2 + 0, 'spray');
  // instruments: reported vs true
  const trueOf = { temperature: truth.temp_mc, humidity: truth.rh_permille, moisture: truth.mc_bp, heat_power: truth.heat_w };
  let iy = y0;
  const ix = x0 + cw + 24;
  ctx.textBaseline = 'top';
  for (const d of devs.filter(d => d.kind === 'transmitter')) {
    const reported = v[`${d.id}/value`], real = trueOf[d.measures];
    const off = reported != null && real != null && Math.abs(reported - real) > (d.measures === 'temperature' ? 1500 : d.measures === 'humidity' ? 30 : d.measures === 'moisture' ? 150 : 10000);
    ctx.fillStyle = off ? css('--beam-blocked') : css('--ink'); ctx.font = '600 12px system-ui';
    ctx.fillText(`${d.id}  ${procVal(d.measures, reported)}`, ix, iy);
    ctx.fillStyle = css('--muted'); ctx.font = '11px system-ui';
    ctx.fillText(`${d.measures.replace('_', ' ')} · true ${procVal(d.measures, real)}${off ? ' · DISAGREES' : ''}`, ix, iy + 15);
    hits.push({ id: d.id, x: ix - 4, y: iy - 2, w: 230, h: 30 });
    iy += 36;
  }
  // hidden truth: what the verifier sees
  ctx.fillStyle = css('--beam-blocked'); ctx.font = '600 11px system-ui';
  ctx.fillText('▲ hidden truth (no instrument shows this)', 20, y0 + ch + 14);
  ctx.fillStyle = css('--ink'); ctx.font = '12px system-ui';
  const grad = truth.gradient_permille / 1000;
  ctx.fillText(`drying gradient ${isFinite(grad) ? grad.toFixed(2) : '–'} (pine tolerates ~3.5) · drying ${((truth.drying_rate_bp_h || 0) / 100).toFixed(2)} %/h · crack index ${truth.crack_index ?? 0} · heat used ${((truth.energy_wh || 0) / 1e6).toFixed(1)} MWh`, 20, y0 + ch + 30);
  drawProcessTrend(ctx, W, H, unit, devs);
}
function drawProcessTrend(ctx, W, H, unit, devs) {
  const top = 290, h = H - top - 16, left = 44, right = W - 16;
  const tt = devs.find(d => d.measures === 'temperature'), mt = devs.find(d => d.measures === 'humidity');
  const n = frames.length, step = Math.max(1, Math.floor(n / (right - left)));
  const X = i => left + (i / Math.max(1, n - 1)) * (right - left);
  const line = (get, max, color, dash) => {
    ctx.strokeStyle = css(color); ctx.setLineDash(dash); ctx.lineWidth = 1.4; ctx.beginPath();
    let on = false;
    for (let i = 0; i < n; i += step) {
      const val = get(frames[i]); if (val == null) continue;
      const y = top + h - Math.max(0, Math.min(1, val / max)) * h;
      on ? ctx.lineTo(X(i), y) : ctx.moveTo(X(i), y); on = true;
    }
    ctx.stroke(); ctx.setLineDash([]);
  };
  ctx.fillStyle = css('--muted'); ctx.font = '10px system-ui'; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  for (const g of [0, 50, 100]) { const y = top + h - g / 100 * h; ctx.fillText(`${g}`, left - 6, y); ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); }
  line(fr => fr.process?.[unit.id]?.temp_mc / 1000, 100, '--stopping', []);
  if (tt) line(fr => fr.values?.[`${tt.id}/value`] / 1000, 100, '--stopping', [4, 3]);
  line(fr => fr.process?.[unit.id]?.rh_permille / 10, 100, '--beam', []);
  if (mt) line(fr => fr.values?.[`${mt.id}/value`] / 10, 100, '--beam', [4, 3]);
  line(fr => fr.process?.[unit.id]?.mc_bp / 100, 100, '--log', []);
  ctx.strokeStyle = css('--beam-blocked'); ctx.beginPath(); ctx.moveTo(X(index), top); ctx.lineTo(X(index), top + h); ctx.stroke();
  ctx.textAlign = 'left'; ctx.fillStyle = css('--muted');
  ctx.fillText('whole run · °C and % · solid: true, dashed: as the probe reports · orange temperature, blue humidity, brown wood moisture', left, top - 8);
}

function drawStats(f) {
  if (layout.units?.length) {
    const unit = layout.units[0], truth = (f.process || {})[unit.id] || {};
    const alarms = (f.alarms || []).length
      ? f.alarms.map(a => `<div class="alarm"><b>${a.alarm_id}</b> <span class="hint">${(a.tick * layout.tick_ms / 3600000).toFixed(1)} h</span><br>${a.message}</div>`).join('')
      : '<div class="hint">no active alarms</div>';
    const items = [['Elapsed', `${(f.sim_time_ms / 3600000).toFixed(1)} h`], ['Step', f.values?.[`${unit.id}/program_step`] ?? '–'],
      ['Heat used (true)', `${((truth.energy_wh || 0) / 1e6).toFixed(1)} MWh`], ['Crack index (true)', truth.crack_index ?? 0]];
    $('stats').innerHTML = items.map(([k, val]) => `<div class="stat"><div class="k">${k}</div><div class="v">${val}</div></div>`).join('')
      + `<div class="stat alarms"><div class="k">Alarms</div>${alarms}</div>`;
    return;
  }
  const items = [
    ['Released', f.counters.released], ['Delivered', f.counters.delivered],
    ['In transit', f.materials.length], ['Source blocked (ticks)', f.counters.source_blocked_ticks],
  ];
  for (const [id, s] of Object.entries(f.sensors)) items.push([`${id} count`, s.count]);
  items.push(['Resets', f.counters.resets]);
  if (f.counters.chips_dm3 != null) items.push(['Chips (dm³)', f.counters.chips_dm3], ['Bark (dm³)', f.counters.bark_dm3]);
  const alarms = (f.alarms || []).length
    ? f.alarms.map(a => `<div class="alarm"><b>${a.alarm_id}</b> <span class="hint">t=${a.tick} · ${(a.tick * layout.tick_ms / 1000).toFixed(1)} s</span><br>${a.message}</div>`).join('')
    : '<div class="hint">no active alarms</div>';
  $('stats').innerHTML = items.map(([k, v]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v ?? '–'}</div></div>`).join('')
    + `<div class="stat alarms"><div class="k">Alarms</div>${alarms}</div>`;
}
window.addEventListener('resize', () => frames.length && render());
</script>
</body>
